name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6cf64d17c08dfc75392c55784b872fe9a6056553 # v0.6.57
    permissions:
      contents: read
  security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/security.yml@6cf64d17c08dfc75392c55784b872fe9a6056553 # v0.6.57
    permissions:
      contents: read
      issues: write
